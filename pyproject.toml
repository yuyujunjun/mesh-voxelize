[build-system]
requires = ["setuptools>=64", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-voxelize"
version = "0.2.0"
description = "Fast CPU + GPU mesh voxelization from TRELLIS.2/o-voxel. GPU variant (CUDA) gives 3× speedup vs CPU with 99.99% IoU."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/yuyujunjun/mesh-voxelize"
